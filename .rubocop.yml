# Basic RuboCop configuration for Rails projects

plugins:
  - rubocop-rails

require:
  - ./lib/rubocop/cop/rspec/no_when_in_it
  - ./lib/rubocop/cop/rails/service_class_suffix

RSpec/NoWhenInIt:
  Enabled: true
  Include:
    - "spec/**/*"

Rails/ServiceClassSuffix:
  Enabled: true
  Include:
    - "app/services/**/*"

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
    - 'bin/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'storage/**/*'

# Layout rules
Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'

Layout/IndentationWidth:
  Width: 2

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

Layout/FirstParameterIndentation:
  EnforcedStyle: consistent

# Lint rules
Lint/UnusedMethodArgument:
  Enabled: true

Lint/UnusedBlockArgument:
  Enabled: true

Lint/UnreachableCode:
  Enabled: true

# Style rules
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/HashSyntax:
  EnforcedStyle: ruby19_no_mixed_keys

Style/SymbolArray:
  EnforcedStyle: percent
  MinSize: 3

Style/WordArray:
  EnforcedStyle: percent
  MinSize: 3

Style/IfUnlessModifier:
  Enabled: true

Style/WhileUntilModifier:
  Enabled: true

Style/UnlessElse:
  Enabled: false

Style/GuardClause:
  Enabled: true

Style/SafeNavigation:
  Enabled: true

Style/Documentation:
  Enabled: false

# Metrics rules
Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Max: 150

Metrics/ParameterLists:
  Max: 10

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/routes.rb'
    - 'lib/tasks/**/*'

# Security rules
Security/YAMLLoad:
  Enabled: true

Security/JSONLoad:
  Enabled: true

# Bundler rules
Bundler/OrderedGems:
  Enabled: true

# Rails rules
Rails/SkipsModelValidations:
  # The runner streams metric samples in batches and re-posts them on retry; the bulk
  # upsert on the `[run_id, epoch]` unique index is what makes that idempotent, and the
  # database constraints are the ones that matter for those rows.
  # Releasing stale runs happens on every claim poll of twelve runners: one UPDATE over the
  # `stale` scope, writing a literal status and clearing the claim, touches no validated
  # attribute and must not become a per-run round trip.
  AllowedMethods:
    - upsert_all
    - update_all
  # Spec support builds bulk fixture rows, not domain writes: a pruning example needs
  # dozens of snapshots whose only meaningful column is `epoch`.
  Exclude:
    - 'spec/support/**/*'

Rails/RedundantActiveRecordAllMethod:
  # `Findings::Registry.all` is the findings log held in Ruby, not a relation: without
  # `all` the call would land on `Module#first`.
  AllowedReceivers:
    - Findings::Registry
    - Registry

Rails/Output:
  Exclude:
    - 'lib/tasks/**/*'

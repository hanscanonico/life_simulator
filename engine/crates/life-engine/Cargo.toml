[package]
name = "life-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "life_engine"
path = "src/lib.rs"

[features]
# Fixture builders for the pre-lineage snapshot formats, for crates that must keep
# reading them; `engine/crates/runner` enables it as a dev-dependency.
legacy-fixtures = []

[dependencies]
flate2.workspace = true
rand_core.workspace = true
rand_xoshiro.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "engine"
harness = false

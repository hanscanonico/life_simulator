[workspace]
resolver = "2"
members = ["crates/life-engine", "crates/runner", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
life-engine = { path = "crates/life-engine" }
rand_core = "0.6"
rand_xoshiro = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The pinned determinism tests execute hundreds of millions of interpreter steps;
# unoptimised they would dominate `cargo test`.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1

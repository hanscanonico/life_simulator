# Named explicitly: compose would otherwise derive the project name from this
# directory ("deploy"), which every other stack on the mini-pc could also claim.
name: life-simulator

# Unbounded json-file logs are the mini-pc's usual way of filling its disk: the
# runner alone prints a line per claim, forever.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: life_simulator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: life_simulator_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-local only, for psql access and backups. 5433 because the stock
      # market stack on this machine already binds 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life_simulator -d life_simulator_production"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Named rather than left to compose's project-derived default, so
    # deploy/deploy can tag the running build :previous and roll back to it.
    image: life-simulator-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      RAILS_ENV: production
      # Thruster's listening port. It overwrites PORT for Puma itself, so this
      # is the knob, not PORT.
      HTTP_PORT: "8080"
      SOLID_QUEUE_IN_PUMA: "1"
      DATABASE_URL: postgres://life_simulator:${POSTGRES_PASSWORD}@db:5432/life_simulator_production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set in deploy/.env}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # The lab status page reads this to say how many slots are idle; keep the
      # default in step with the runner's --parallelism below.
      RUNNER_PARALLELISM: ${RUNNER_PARALLELISM:-12}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host-local only, for curl checks and LAN debugging via SSH tunnel.
      - "127.0.0.1:8070:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/up >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  runner:
    # The same image as the app — one build, two commands — so a deploy always
    # runs the engine that matches the schema and the API it talks to.
    image: life-simulator-app:latest
    command: runner lab --api http://app:8080 --parallelism ${RUNNER_PARALLELISM:-12}
    restart: unless-stopped
    logging: *logging
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # A gigabyte under the hard limit below: a slot that would claim past this
      # waits instead. The OOM kill it avoids costs every in-flight run the
      # 5-minute stale release before anyone can resume it.
      RUNNER_MAX_MEMORY: ${RUNNER_MAX_MEMORY:-5g}
    depends_on:
      app:
        condition: service_healthy
    # SIGTERM makes the runner flush its samples and heartbeat before it exits;
    # the app then releases the run and the next claim resumes it.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          # 14 of the 16 cores: the site keeps two whatever the soup is doing.
          cpus: "14"
          memory: 6g

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *logging
    # `:-` rather than `:?`: compose interpolates the whole file, so a required
    # token would refuse `up -d app` too. A missing one fails here, visibly.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
